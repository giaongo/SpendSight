[project]
name = "spendsight"
version = "0.1.0"
description = "SpendSight API. Aino's demo ledger, plus a read-only Junction dataset."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "full_data: checks dataset-wide totals; runs only with SPENDSIGHT_TEST_FULL_DATA=1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness only (pyflakes, import and syntax errors). Style rules would churn
# the oracle-checked ledger math in app/money.py and app/ledger.py.
select = ["E4", "E7", "E9", "F"]
